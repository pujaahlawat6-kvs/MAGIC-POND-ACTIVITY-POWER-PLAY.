<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 3 - Exponential Growth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>📈 Exponential Growth Visualizer</h1>

<div class="controls">
<label>Day:
<input type="range" id="day" min="1" max="10" value="1" oninput="draw()">
<span id="d">1</span>
</label>
</div>

<canvas id="graph" width="700" height="350"></canvas>

<div class="formula">
<h2>Pattern</h2>
<p id="formula"></p>
</div>

<div class="quiz">
<h2>Quick Challenge</h2>
<p>How many lotus flowers are there on Day 6?</p>
<button onclick="check(16)">16</button>
<button onclick="check(32)">32</button>
<button onclick="check(64)">64</button>
<p id="result"></p>
</div>

<script src="script.js"></script>
</body>
</html>
